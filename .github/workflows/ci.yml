name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen: fail if uv.lock is out of date rather than silently resolving
      # something the developer never ran.
      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check

      # No .env here; tests/conftest.py supplies the environment before app.* is
      # imported, which is what makes this possible at all.
      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # The multi-stage build is easy to break (the venv's absolute paths, the
      # explicitly-copied logging_config.yaml), and nothing else would catch it.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Caddyfile
        run: |
          docker build -f Caddy.Dockerfile -t caddy-local .
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy-local caddy validate --config /etc/caddy/Caddyfile
