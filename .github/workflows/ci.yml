name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo>/api and /caddy
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen: fail if uv.lock is out of date rather than silently resolving
      # something the developer never ran.
      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check

      # No .env here; tests/conftest.py supplies the environment before app.* is
      # imported, which is what makes this possible at all.
      - name: Tests
        run: uv run pytest -q

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Only main publishes. Branches and PRs still build, so a broken Dockerfile
      # fails there rather than at deploy time.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_BASE }}/api:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # xcaddy compiles Caddy from Go source. Doing that here rather than on the
      # droplet is the main reason to publish images at all.
      - name: Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Caddy.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_BASE }}/caddy:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/caddy:latest
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Validate Caddyfile
        run: |
          docker build -f Caddy.Dockerfile -t caddy-local .
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy-local caddy validate --config /etc/caddy/Caddyfile

  deploy:
    # Never deploys unless the tests and both images are green.
    needs: [check, images]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to the droplet
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key, so a hijacked DNS record cannot collect our deploy key.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            env IMAGE_TAG="$GITHUB_SHA" bash -euo pipefail -s <<'REMOTE'
          cd /srv/pixelwars/backend

          # Only compose.yaml, compose.prod.yaml and the Caddyfile are read from disk;
          # everything else now lives in the image. .env is untracked and survives.
          git fetch --prune origin
          git reset --hard origin/main

          compose() { docker compose -f compose.yaml -f compose.prod.yaml "$@"; }

          compose pull
          # --wait blocks on the healthchecks already defined in compose.yaml, so a
          # container that starts and then dies fails the deploy instead of passing it.
          compose up -d --wait --wait-timeout 180

          compose ps
          docker image prune -f
          REMOTE
