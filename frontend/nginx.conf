server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA: everything that is not a real file falls back to index.html
  location / {
    try_files $uri /index.html;
  }

  # Socket.IO needs the upgrade dance for the websocket transport.
  location /socket.io/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 1d;
  }

  # Same-origin proxy so the httpOnly session cookie is sent with API calls.
  location ~ ^/(boards|auth|health) {
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
