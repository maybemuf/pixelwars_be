server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA: everything that is not a real file falls back to index.html
  location / {
    try_files $uri /index.html;
  }

  # Same-origin proxy so the httpOnly session cookie is sent with API calls.
  location ~ ^/(boards|auth|health) {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
