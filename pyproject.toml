[project]
name = "pixelwars_server"
version = "0.1.0"
description = "Python FastAPI backend for pixelwars"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgi-correlation-id>=5.0.1",
    "authlib>=1.7.2",
    "fastapi[standard]>=0.140.2",
    "itsdangerous>=2.2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "python-socketio[asgi]>=5.16.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.setuptools]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
# tests import `app.*`; the repo root isn't on sys.path by default
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120
# leave auto-generated migrations alone
extend-exclude = ["alembic/versions", "app/*/__init__.py"]

[tool.ruff.lint]
# E/F — pyflakes+pycodestyle, I — isort, UP — pyupgrade, B — bugbear
select = ["E", "F", "I", "UP", "B"]
# catches dead imports such as `from sqlalchemy.orm import state`
