version: 1
disable_existing_loggers: true
filters:
  correlation_id:
    (): asgi_correlation_id.CorrelationIdFilter
    uuid_length: 32
    default_value: '-'
formatters:
  simple:
    format: '[%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s:[%(correlation_id)s] %(message)s'
    datefmt: '%Y-%m-%dT%H:%M:%S%z'
  json:
    (): app.core.logging.AppJSONFormatter
    fmt_keys:
      level: levelname
      message: message
      timestamp: timestamp
      logger: name
      module: module
      function: funcName
      line: lineno
      thread_name: threadName
handlers:
  stdout:
    class: logging.StreamHandler
    filters:
      - correlation_id
    formatter: simple
    stream: ext://sys.stdout
    level: DEBUG
  file: 
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/log.jsonl
    maxBytes: 100000
    backupCount: 3
  queue_handler:
    class: logging.handlers.QueueHandler
    handlers:
      - stdout
      - file
loggers:
  root:
    handlers:
      - queue_handler